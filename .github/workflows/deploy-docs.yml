name: Deploy Docs

on:
  push:
    branches: [main, alpha]
    paths:
      - docs/**
      - docs-site/**
      - scripts/extract-embeddings.mjs

  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm exec vp pack

      - name: Generate snapshot
        run: node dist/cli.mjs snapshot generate src
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}

      - name: Determine base path
        id: base
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "path=/kural/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/kural/${{ github.ref_name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build docs site
        run: pnpm run docs:build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}

      - name: Generate SPA fallback pages
        run: |
          cp docs-site/.output/public/_shell.html docs-site/.output/public/index.html
          cp docs-site/.output/public/_shell.html docs-site/.output/public/404.html

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ github.ref_name == 'main' && 'stable' || github.ref_name }}
          path: docs-site/.output/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
        continue-on-error: true

      - name: Download current branch build
        uses: actions/download-artifact@v4
        with:
          name: docs-${{ github.ref_name == 'main' && 'stable' || github.ref_name }}
          path: site/${{ github.ref_name == 'main' && '.' || github.ref_name }}

      - name: Download stable build (when deploying a branch)
        if: github.ref_name != 'main'
        uses: actions/download-artifact@v4
        with:
          name: docs-stable
          path: site/
        continue-on-error: true

      - name: Download alpha build (when deploying main)
        if: github.ref_name == 'main'
        uses: actions/download-artifact@v4
        with:
          name: docs-alpha
          path: site/alpha
        continue-on-error: true

      - name: Generate root 404 fallback
        run: |
          if [ ! -f site/404.html ]; then
            # Use alpha shell as the root 404 fallback if no stable build exists
            cp site/alpha/404.html site/404.html 2>/dev/null || true
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
